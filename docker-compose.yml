services:
  postgres:
    image: postgres:15-alpine
    container_name: streakhabit-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: streakhabit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"

  # server:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile
  #   container_name: streakhabit-api
  #   restart: always
  #   depends_on:
  #     - postgres
  #   environment:
  #     PORT: 5000
  #     DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/streakhabit_db
  #     NODE_ENV: production
  #   ports:
  #     - "5000:5000"

  client:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
  # client:
  #   build:
